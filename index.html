<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>서로를 알아가는 5-4 가족 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDi7Foz2uy6ehTq6DVtqXYHx38oADjDxmc",
            authDomain: "quiz-a62b6.firebaseapp.com",
            projectId: "quiz-a62b6",
            storageBucket: "quiz-a62b6.firebasestorage.app",
            messagingSenderId: "820572663251",
            appId: "1:820572663251:web:1a6c6900b47276244bd326"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 전역 객체에 할당하여 기존 함수들이 사용할 수 있게 함
        window.db = db;
        window.fb = { collection, addDoc, getDocs, doc, deleteDoc, updateDoc, query, orderBy };
        
        // 데이터 초기 로딩
        window.loadQuizzes();
    </script>

    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; word-break: keep-all; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input, textarea, select { font-size: 16px !important; }
        .btn-bounce:active { transform: scale(0.96); }
        .gradient-header { background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <div id="app" class="bg-white w-full max-w-md min-h-screen flex flex-col shadow-none sm:shadow-2xl sm:min-h-[850px] sm:my-8 sm:rounded-[3rem] overflow-hidden relative border-x sm:border-8 border-indigo-50">
        
        <header class="gradient-header p-8 pt-12 text-white text-center shadow-lg relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                <svg width="100%" height="100%"><pattern id="pattern" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r="2" fill="white"/></pattern><rect width="100%" height="100%" fill="url(#pattern)"/></svg>
            </div>
            <h1 class="text-2xl font-black flex items-center justify-center gap-2 relative z-10"><span>🌈</span> 5-4 가족 퀴즈</h1>
            <p class="text-indigo-100 text-xs mt-2 font-medium opacity-90 relative z-10 tracking-widest uppercase">Family Connection Quiz</p>
        </header>

        <main id="main-screen" class="p-8 flex-1 flex flex-col justify-center gap-10">
            <div class="space-y-4">
                <button onclick="openCreateAuth()" class="btn-bounce w-full bg-indigo-50 border-2 border-indigo-200 text-indigo-700 font-bold py-5 rounded-[2rem] flex items-center justify-center gap-3 text-lg transition-all">
                    <span>✍️</span> 퀴즈 만들기
                </button>
                <div class="relative py-6">
                    <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-gray-100"></span></div>
                    <div class="relative flex justify-center text-[10px] uppercase font-black tracking-[0.3em] text-gray-300"><span class="bg-white px-6">참여하기</span></div>
                </div>
                <div class="grid grid-cols-1 gap-4">
                    <button onclick="showQuizList('parent')" class="btn-bounce w-full bg-indigo-600 text-white font-bold py-7 rounded-[2rem] shadow-xl flex flex-col items-center">
                        <span class="text-3xl mb-1">🙋‍♀️</span>
                        <span class="text-lg">학부모 참여</span>
                    </button>
                    <button onclick="showQuizList('student')" class="btn-bounce w-full bg-amber-500 text-white font-bold py-7 rounded-[2rem] shadow-xl flex flex-col items-center">
                        <span class="text-3xl mb-1">🙋‍♂️</span>
                        <span class="text-lg">학생 참여</span>
                    </button>
                </div>
            </div>
            <button onclick="openAdminAuth()" class="mt-8 text-gray-300 text-[10px] font-bold hover:text-indigo-400 uppercase tracking-[0.3em] self-center">Admin Settings</button>
        </main>

        <div id="list-screen" class="hidden p-6 flex-1 flex flex-col overflow-hidden">
            <button onclick="goHome()" class="mb-6 text-gray-400 flex items-center gap-2 font-bold text-sm">◀ 처음으로</button>
            <h2 id="list-title" class="text-2xl font-black mb-6 text-gray-800">참여할 퀴즈 선택</h2>
            <div id="quiz-items-container" class="flex-1 overflow-y-auto space-y-3 custom-scrollbar pb-10"></div>
        </div>

        <div id="play-screen" class="hidden p-6 flex-1 flex flex-col bg-white">
            <div class="mb-6">
                <div class="flex justify-between items-end mb-6">
                    <span id="quiz-category" class="text-[10px] font-black px-4 py-1.5 bg-indigo-100 text-indigo-700 rounded-full uppercase">Participant</span>
                    <span id="question-progress" class="text-xs font-black text-indigo-500 bg-indigo-50 px-4 py-1.5 rounded-full border">1 / 10</span>
                </div>
                <div class="space-y-4">
                    <h2 id="current-question-num" class="text-3xl font-black text-indigo-600 italic">Q1.</h2>
                    <div class="bg-gray-50 p-6 rounded-[2rem] border-2 border-gray-100 min-h-[140px] flex items-center shadow-inner">
                        <p id="current-question-text" class="text-xl font-bold text-gray-800 leading-snug">질문</p>
                    </div>
                </div>
            </div>
            <div id="options-container" class="grid grid-cols-1 gap-3 mb-10 overflow-y-auto custom-scrollbar"></div>
        </div>

        <div id="result-screen" class="hidden p-8 flex-1 flex flex-col items-center justify-center text-center">
            <div id="result-emoji" class="text-8xl mb-8 animate-bounce">🎉</div>
            <h2 class="text-7xl font-black text-indigo-600 mb-6" id="result-score">0</h2>
            <div class="bg-indigo-50/50 p-8 rounded-[2.5rem] mb-10 w-full border border-indigo-100">
                <p id="result-message" class="text-indigo-900 font-bold text-xl">메시지</p>
            </div>
            <button onclick="goHome()" class="btn-bounce w-full bg-indigo-600 text-white font-black py-5 rounded-[2rem]">메인으로 돌아가기</button>
        </div>

        <div id="admin-screen" class="hidden p-6 flex-1 flex flex-col overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-black text-gray-800">🛠 관리 도구</h2>
                <button onclick="goHome()" class="text-[10px] font-black text-gray-400 border-2 border-gray-100 px-4 py-2 rounded-full uppercase hover:bg-gray-50">Exit</button>
            </div>
            <div id="admin-quiz-list" class="flex-1 overflow-y-auto space-y-3 custom-scrollbar pb-10"></div>
        </div>

        <div id="create-modal" class="hidden fixed inset-0 modal-overlay z-[60] flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-md rounded-[3rem] shadow-2xl overflow-hidden flex flex-col h-[85vh] relative">
                <div class="p-8 border-b flex justify-between items-center bg-gray-50/80 sticky top-0 z-10">
                    <h3 id="modal-title" class="font-black text-xl text-gray-800">📝 퀴즈 만들기</h3>
                    <button onclick="closeCreateModal()" class="text-gray-300 text-4xl leading-none">&times;</button>
                </div>
                <div class="p-8 overflow-y-auto flex-1 custom-scrollbar space-y-10">
                    <section class="space-y-4">
                        <label class="text-xs font-black text-indigo-600 uppercase">1. 작성자 정보</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="setCreator('student')" id="btn-creator-student" class="py-4 border-2 rounded-2xl font-bold border-indigo-600 bg-indigo-50 text-indigo-600">학생</button>
                            <button onclick="setCreator('parent')" id="btn-creator-parent" class="py-4 border-2 rounded-2xl font-bold border-gray-100 text-gray-400 bg-gray-50">학부모</button>
                        </div>
                        <select id="creator-name-select" class="w-full p-4 bg-gray-50 rounded-2xl border font-bold outline-none focus:border-indigo-500"></select>
                    </section>
                    <section class="space-y-6 pt-6 border-t border-dashed">
                        <label class="text-xs font-black text-indigo-600 uppercase">2. 문제 및 정답 입력 (1~10번)</label>
                        <div id="questions-input-container" class="space-y-10"></div>
                    </section>
                    <section class="space-y-6 pt-6 border-t border-dashed pb-10">
                        <label class="text-xs font-black text-indigo-600 uppercase">3. 결과 메시지 설정</label>
                        <div class="space-y-4">
                            <input type="text" id="msg-100" placeholder="100점 만점 시 메시지" class="w-full p-4 bg-gray-50 rounded-2xl border outline-none">
                            <input type="text" id="msg-60" placeholder="60점 이상 시 메시지" class="w-full p-4 bg-gray-50 rounded-2xl border outline-none">
                            <input type="text" id="msg-20" placeholder="20점 이하 시 메시지" class="w-full p-4 bg-gray-50 rounded-2xl border outline-none">
                        </div>
                    </section>
                </div>
                <div class="p-8 bg-gray-50 border-t sticky bottom-0">
                    <button onclick="saveFullQuiz()" id="btn-save-quiz" class="btn-bounce w-full bg-indigo-600 text-white font-black py-5 rounded-[2rem] shadow-xl text-lg">퀴즈 저장 완료</button>
                </div>
            </div>
        </div>

        <div id="create-auth-modal" class="hidden fixed inset-0 modal-overlay z-[70] flex items-center justify-center p-6">
            <div class="bg-white w-full max-w-[280px] rounded-[2.5rem] p-10 flex flex-col items-center shadow-2xl">
                <h3 class="font-black text-lg mb-4">🔐 퀴즈 생성 비번</h3>
                <input type="password" id="create-pw" placeholder="••••" class="w-full p-4 bg-gray-50 border-2 rounded-2xl text-center text-3xl mb-6 outline-none">
                <button onclick="checkCreateAuth()" class="w-full bg-indigo-600 text-white rounded-2xl font-black py-4">Confirm</button>
            </div>
        </div>

        <div id="auth-modal" class="hidden fixed inset-0 modal-overlay z-[70] flex items-center justify-center p-6">
            <div class="bg-white w-full max-w-[280px] rounded-[2.5rem] p-10 flex flex-col items-center shadow-2xl">
                <h3 class="font-black text-lg mb-4">🛠 관리자 인증</h3>
                <input type="password" id="admin-pw" placeholder="••••" class="w-full p-4 bg-gray-50 border-2 rounded-2xl text-center text-3xl mb-6 outline-none">
                <button onclick="checkAdminAuth()" class="w-full bg-gray-800 text-white rounded-2xl font-black py-4">Verify</button>
            </div>
        </div>
    </div>

    <script>
        const studentNames = ["강유림", "김상우", "김서아", "김수인", "박서연", "백현우", "부성후", "심예찬", "임상준", "장도윤", "장지윤", "정대로", "조하나", "주설현", "최다솔", "최하랑", "한혜빈"];
        const fixedQuestions = {
            student: ["내가 제일 좋아하는 음식은?", "내가 제일 좋아하는 과목은?", "하루 중 가장 기쁜 순간은?", "내가 요즘 제일 관심이 가는 것은...", "내가 가장 기분이 안 좋을 때는.."],
            parent: ["부모님은 몇시에 일어나실까요?", "부모님이 가장 좋아하는 음식은?", "부모님의 고향은 어디인가요?", "부모님이 가장 기분이 좋을 때는 언제인가요?", "부모님이 가장 슬플 때는 언제일까요?"]
        };

        let quizzes = [];
        let selectedCreator = 'student';
        let currentQuizSet = null;
        let currentQuestionIdx = 0;
        let userScore = 0;
        let editingFireId = null;

        window.onload = () => {
            const select = document.getElementById('creator-name-select');
            select.innerHTML = '<option value="">이름을 선택하세요</option>';
            studentNames.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.innerText = name;
                select.appendChild(opt);
            });
            renderQuestionInputs();
        };

        // --- 파이어베이스 동기화 로직 ---
        window.loadQuizzes = async () => {
            if (!window.db) return;
            const q = window.fb.query(window.fb.collection(window.db, "quizzes"), window.fb.orderBy("timestamp", "desc"));
            const snapshot = await window.fb.getDocs(q);
            quizzes = snapshot.docs.map(doc => ({ fireId: doc.id, ...doc.data() }));
            console.log("Data Synced:", quizzes.length);
        };

        function renderQuestionInputs() {
            const container = document.getElementById('questions-input-container');
            container.innerHTML = '';
            const currentFixed = fixedQuestions[selectedCreator];
            for(let i=1; i<=10; i++) {
                const isFixed = i <= 5;
                const div = document.createElement('div');
                div.className = `p-6 ${isFixed ? 'bg-indigo-50/50' : 'bg-amber-50/40'} rounded-[2rem] border relative space-y-4 shadow-sm`;
                div.innerHTML = `
                    <span class="absolute -top-2 -left-2 ${isFixed ? 'bg-indigo-600' : 'bg-amber-500'} text-white font-black w-8 h-8 rounded-full flex items-center justify-center text-[10px]">#${i}</span>
                    <textarea id="q-text-${i}" rows="2" class="w-full p-4 bg-white rounded-2xl border text-sm font-bold" ${isFixed ? 'readonly' : ''}>${isFixed ? currentFixed[i-1] : ""}</textarea>
                    <input type="text" id="q-ans-${i}" placeholder="✅ 정답" class="w-full p-4 bg-white border-2 border-green-200 rounded-2xl font-bold text-green-700">
                    <div class="grid grid-cols-1 gap-2">
                        <input type="text" id="q-w1-${i}" placeholder="❌ 오답 1" class="p-3 bg-white border rounded-xl text-xs">
                        <input type="text" id="q-w2-${i}" placeholder="❌ 오답 2" class="p-3 bg-white border rounded-xl text-xs">
                        <input type="text" id="q-w3-${i}" placeholder="❌ 오답 3" class="p-3 bg-white border rounded-xl text-xs">
                    </div>
                `;
                container.appendChild(div);
            }
        }

        async function saveFullQuiz() {
            const name = document.getElementById('creator-name-select').value;
            if(!name) return alert('작성자 이름을 선택하세요!');

            const questionList = [];
            for(let i=1; i<=10; i++) {
                const text = document.getElementById(`q-text-${i}`).value;
                const ans = document.getElementById(`q-ans-${i}`).value;
                const opts = [ans, document.getElementById(`q-w1-${i}`).value, document.getElementById(`q-w2-${i}`).value, document.getElementById(`q-w3-${i}`).value].filter(v => v.trim() !== '');
                if(text && ans && opts.length >= 2) questionList.push({ id: i, text, answer: ans, options: opts });
            }

            const data = {
                id: Date.now(),
                creatorRole: selectedCreator,
                creatorName: name,
                questions: questionList,
                messages: {
                    100: document.getElementById('msg-100').value || '역시 우린 찰떡궁합!',
                    60: document.getElementById('msg-60').value || '우와, 나를 많이 아네요!',
                    20: document.getElementById('msg-20').value || '이제부터 알아가요!'
                },
                timestamp: Date.now()
            };

            try {
                if(editingFireId) {
                    await window.fb.updateDoc(window.fb.doc(window.db, "quizzes", editingFireId), data);
                    alert('수정 완료!');
                } else {
                    await window.fb.addDoc(window.fb.collection(window.db, "quizzes"), data);
                    alert('등록 완료!');
                }
                location.reload();
            } catch (e) { alert("오류: " + e); }
        }

        // --- UI 제어 로직 ---
        function showQuizList(role) {
            const container = document.getElementById('quiz-items-container');
            const targetRole = role === 'parent' ? 'student' : 'parent';
            const filtered = quizzes.filter(q => q.creatorRole === targetRole);
            container.innerHTML = filtered.length ? '' : '<p class="text-center py-20 opacity-30 font-bold">등록된 퀴즈가 없습니다.</p>';
            
            document.getElementById('list-title').innerText = role === 'parent' ? "👧 아이들의 퀴즈 목록" : "👨‍👩‍👧‍👦 부모님의 퀴즈 목록";

            filtered.forEach(q => {
                const btn = document.createElement('button');
                btn.className = "w-full bg-white p-6 rounded-[2rem] border-2 flex justify-between items-center shadow-sm active:border-indigo-500 mb-2";
                btn.onclick = () => startQuizSession(q);
                btn.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-indigo-50 rounded-full flex items-center justify-center text-xl">${q.creatorRole === 'parent' ? '👩' : '👧'}</div>
                        <div class="text-left"><h4 class="font-black">${q.creatorName}</h4><p class="text-[10px] text-gray-400 uppercase tracking-tighter">${q.questions.length} Items</p></div>
                    </div>
                    <span class="text-indigo-400 text-sm font-black">START ▶</span>
                `;
                container.appendChild(btn);
            });
            showScreen('list-screen');
        }

        function startQuizSession(quizSet) {
            currentQuizSet = quizSet; currentQuestionIdx = 0; userScore = 0;
            renderQuestion(); showScreen('play-screen');
        }

        function renderQuestion() {
            const q = currentQuizSet.questions[currentQuestionIdx];
            document.getElementById('quiz-category').innerText = currentQuizSet.creatorName;
            document.getElementById('question-progress').innerText = `${currentQuestionIdx + 1} / ${currentQuizSet.questions.length}`;
            document.getElementById('current-question-num').innerText = `Q${currentQuestionIdx + 1}.`;
            document.getElementById('current-question-text').innerText = q.text;
            
            const box = document.getElementById('options-container');
            box.innerHTML = '';
            [...q.options].sort(() => Math.random() - 0.5).forEach(opt => {
                const b = document.createElement('button');
                b.className = "w-full p-5 bg-white border-2 rounded-2xl font-bold text-left active:bg-indigo-50 shadow-sm";
                b.innerText = opt;
                b.onclick = () => {
                    if(opt === q.answer) userScore += (100 / currentQuizSet.questions.length);
                    if(++currentQuestionIdx < currentQuizSet.questions.length) renderQuestion();
                    else finishQuiz();
                };
                box.appendChild(b);
            });
        }

        function finishQuiz() {
            const score = Math.round(userScore);
            document.getElementById('result-score').innerText = score;
            const msg = score >= 100 ? currentQuizSet.messages[100] : (score >= 60 ? currentQuizSet.messages[60] : currentQuizSet.messages[20]);
            document.getElementById('result-message').innerText = msg;
            showScreen('result-screen');
        }

        function showScreen(id) {
            ['main-screen', 'list-screen', 'play-screen', 'result-screen', 'admin-screen'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
        function goHome() { showScreen('main-screen'); }
        function openCreateAuth() { document.getElementById('create-auth-modal').classList.remove('hidden'); }
        function checkCreateAuth() {
            if(document.getElementById('create-pw').value === '0504') {
                document.getElementById('create-auth-modal').classList.add('hidden');
                document.getElementById('create-modal').classList.remove('hidden');
            } else alert('비밀번호가 틀렸습니다!');
        }
        function closeCreateModal() { document.getElementById('create-modal').classList.add('hidden'); }
        function setCreator(role) { selectedCreator = role; renderQuestionInputs(); }

        // --- 관리 도구 ---
        function openAdminAuth() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function checkAdminAuth() {
            if(document.getElementById('admin-pw').value === '5105') {
                document.getElementById('auth-modal').classList.add('hidden');
                showAdminDashboard();
            } else alert('틀렸습니다!');
        }
        function showAdminDashboard() {
            const list = document.getElementById('admin-quiz-list');
            list.innerHTML = quizzes.map(q => `
                <div class="bg-white p-5 rounded-[2rem] border-2 flex justify-between items-center mb-2">
                    <div><h4 class="font-black">${q.creatorName} (${q.creatorRole})</h4></div>
                    <div class="flex gap-2">
                        <button onclick="editQuiz('${q.fireId}')" class="px-4 py-2 bg-indigo-50 text-indigo-600 rounded-xl font-bold text-xs">수정</button>
                        <button onclick="deleteQuiz('${q.fireId}')" class="px-4 py-2 bg-red-50 text-red-500 rounded-xl font-bold text-xs">삭제</button>
                    </div>
                </div>
            `).join('');
            showScreen('admin-screen');
        }
        async function deleteQuiz(id) {
            if(confirm('삭제하시겠습니까?')) {
                await window.fb.deleteDoc(window.fb.doc(window.db, "quizzes", id));
                location.reload();
            }
        }
        function editQuiz(id) {
            const q = quizzes.find(item => item.fireId === id);
            editingFireId = id;
            selectedCreator = q.creatorRole;
            setCreator(q.creatorRole);
            document.getElementById('creator-name-select').value = q.creatorName;
            document.getElementById('msg-100').value = q.messages[100];
            document.getElementById('msg-60').value = q.messages[60];
            document.getElementById('msg-20').value = q.messages[20];
            q.questions.forEach(qs => {
                const text = document.getElementById(`q-text-${qs.id}`);
                const ans = document.getElementById(`q-ans-${qs.id}`);
                if(text) text.value = qs.text;
                if(ans) ans.value = qs.answer;
                const wrongs = qs.options.filter(o => o !== qs.answer);
                wrongs.forEach((w, idx) => {
                    const el = document.getElementById(`q-w${idx+1}-${qs.id}`);
                    if(el) el.value = w;
                });
            });
            document.getElementById('modal-title').innerText = "🛠 퀴즈 수정";
            document.getElementById('create-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
